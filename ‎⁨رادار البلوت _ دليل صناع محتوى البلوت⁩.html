<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار البلوت | دليل صناع محتوى البلوت</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--felt:#b80000;--felt2:#111111;--card:#ffffff;--ink:#141414;--mute:#5f5f5f;--red:#b80000;--line:#dcdcdc;--bg:#f2f2f2;--ink-on:#f3f1e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1e1e1e;--ink:#f2f2f2;--mute:#aaaaaa;--red:#ff5a4d;--line:#3a3a3a;--bg:#0e0e0e;--felt:#b80000;--felt2:#111111}}
:root[data-theme="dark"]{--card:#1e1e1e;--ink:#f2f2f2;--mute:#aaaaaa;--red:#ff5a4d;--line:#3a3a3a;--bg:#0e0e0e;--felt:#b80000;--felt2:#111111}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.7}
header{background:#111;color:var(--ink-on);padding:44px 20px 56px;text-align:center}
h1{font-family:"Reem Kufi",Tahoma,sans-serif;font-size:clamp(34px,8vw,60px);margin:0 0 8px;line-height:1.2;letter-spacing:0}
header p{margin:0 auto;max-width:34em;opacity:.85}
main{max-width:980px;margin:-28px auto 40px;padding:0 16px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--ink-on)}
.count{color:var(--mute);margin:16px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;display:flex;flex-direction:column;gap:6px}
.c .s{position:absolute;top:10px;left:14px;font-size:22px;color:var(--red)}
.c h3{margin:0;font-family:"Reem Kufi",Tahoma,sans-serif;font-size:20px}
.tag{display:inline-block;font-size:13px;color:var(--mute)}
.ex{font-size:12px;background:var(--line);border-radius:6px;padding:0 8px;width:max-content}
.row{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.row a,.row button{flex:1;text-align:center;padding:8px;border-radius:9px;border:1px solid var(--felt);background:var(--felt);color:var(--ink-on);text-decoration:none;cursor:pointer}
.row button{background:transparent;color:var(--ink);border-color:var(--line);flex:0 0 auto}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px}
details{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
summary{cursor:pointer;font-weight:700}
form{display:grid;gap:10px;margin-top:12px}
form button{padding:11px;border-radius:10px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
.err{color:var(--red);min-height:1.4em;margin:0}
@media (prefers-reduced-motion:no-preference){.c{transition:transform .15s}.c:hover{transform:translateY(-2px)}}
.logo{display:block;margin:0 auto;width:min(340px,82%);height:auto;background:#fff;border-radius:16px;padding:10px 18px}
h1{margin:0 0 14px}
</style>
</head>
